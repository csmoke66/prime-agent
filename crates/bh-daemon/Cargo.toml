[package]
name = "bh-daemon"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Session supervisor, worker processes, and wire protocol."

[dependencies]
bh-types = { path = "../bh-types" }
bh-core = { path = "../bh-core" }
bh-agent = { path = "../bh-agent" }
bh-ai = { path = "../bh-ai" }
bh-telemetry = { path = "../bh-telemetry" }
anyhow = { workspace = true }
futures = { workspace = true }
globset = "0.4"
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tokio-util = "0.7"
sha2 = "0.11"
uuid = { version = "1", features = ["v4", "v7"] }

[dev-dependencies]
filetime = "0.2"
tempfile = "3"
# The orphan-journal e2e signals and probes process groups directly.
nix = { version = "0.29", features = ["signal", "process"] }
socket2 = "0.6"
# The supervisor property suite draws sibling rosters for the live
# rename ladder; the plain std features are enough (no fork/timeout).
proptest = { workspace = true }
# Test-only: `ModelCatalog::with_urls` + the compiled offline
# model entries build the loopback catalog the session-model restore
# tests script (the bh-core tests/common pattern, in-crate), and the
# catalog-repo child-resolution regression writes the layer-A disk cache
# in the bh-models snapshot shape; the crate's runtime surface goes
# through bh-core.
bh-models = { path = "../bh-models" }
url = "2"
# The MCP catalog e2e seeds the fetch lane's snapshot envelope: the real
# catalog url/scope constants keep the seeded cache byte-honest.
# `test-util` (tokio time pause) is test-only: the mutation-drain latch test
# drives real timeouts through the paused clock.
tokio = { workspace = true, features = ["test-util"] }

[[bin]]
name = "bh-daemon"
path = "src/main.rs"

[lints]
workspace = true
