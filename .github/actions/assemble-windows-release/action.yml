name: Assemble Windows release
description: Build the static-CRT Windows binary and assemble its install payload.
inputs:
  target:
    description: Windows MSVC Rust target triple.
    required: true
  version:
    description: Workspace version with or without a v prefix.
    required: true
  catalog-ref:
    description: SHA of the catalog snapshot to bundle.
    required: true
runs:
  using: composite
  steps:
    # This pin selects the Rust toolchain (1.98.1); the action has no toolchain input.
    - uses: dtolnay/rust-toolchain@ce678459e9fc7500d337468f904b95f1b5c10b5e
      with:
        targets: ${{ inputs.target }}
    - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      with:
        key: ${{ inputs.target }}
    - name: Build (release, locked)
      shell: bash
      env:
        TARGET: ${{ inputs.target }}
        # A stock Windows machine may lack vcruntime140.dll. Keep the shipped
        # launcher self-contained without changing the development build.
        RUSTFLAGS: -C target-feature=+crt-static
      run: cargo build --release --locked --target "$TARGET" -j 4 -p bh-cli --bin prime-agent
    - name: "Livecheck gate: --version prints the workspace version"
      shell: bash
      env:
        TARGET: ${{ inputs.target }}
        VERSION: ${{ inputs.version }}
      run: |
        set -euo pipefail
        out="$("target/$TARGET/release/prime-agent.exe" --version)"
        [[ "$out" == "${VERSION#v}" ]] || { echo "binary reports '$out', expected '${VERSION#v}'"; exit 1; }
    - name: Install cargo-about (renders the archive's third-party notices)
      uses: ./.github/actions/install-cargo-about
    - name: Assemble tarball + checksums + manifest
      shell: bash
      env:
        TARGET: ${{ inputs.target }}
        VERSION: ${{ inputs.version }}
        CATALOG_REF: ${{ inputs.catalog-ref }}
      run: |
        set -euo pipefail
        dir="target/$TARGET"
        python scripts/release/bundle_catalog.py generate --network \
          --catalog-ref "$CATALOG_REF" --out "$dir/catalog-assets"
        python scripts/release/assemble_artifacts.py \
          --repo-root . --version "${VERSION#v}" --target "$TARGET" \
          --binary "$dir/release/prime-agent.exe" \
          --catalog-assets "$dir/catalog-assets" --out-dir "$dir/dist"
        cat "$dir/dist/manifest.json"
