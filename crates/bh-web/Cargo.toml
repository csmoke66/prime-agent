[package]
name = "bh-web"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "HTTP/WebSocket backend that serves the Beehive web UI and bridges it to the daemon socket."

[dependencies]
bh-types = { path = "../bh-types" }
axum = { version = "0.8", default-features = false, features = ["http1", "tokio", "ws", "query", "json"] }
rust-embed = "8"
tokio = { workspace = true }
futures = { workspace = true }
anyhow = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
tempfile = "3"
tokio-tungstenite = { version = "0.30", default-features = false, features = ["connect", "handshake"] }

[lints]
workspace = true
