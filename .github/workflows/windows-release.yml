name: Publish Windows installer release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

# The latest release is shared across versions. Keep the public install smoke
# inside the same lock so it verifies this run's assets before another update.
concurrency:
  group: windows-installer-release
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  build:
    if: github.repository == 'csmoke66/beehive' && github.ref == 'refs/heads/main'
    runs-on: windows-2022
    timeout-minutes: 90
    permissions:
      contents: read
    outputs:
      version: ${{ steps.source.outputs.version }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Resolve the workspace version
        id: source
        shell: bash
        run: |
          set -euo pipefail
          version="$(python -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["workspace"]["package"]["version"])')"
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"
      - name: Build and package Windows
        uses: ./.github/actions/assemble-windows-release
        with:
          target: x86_64-pc-windows-msvc
          version: ${{ steps.source.outputs.version }}
      - name: Upload installer payload
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: windows-installer-payload
          path: |
            target/x86_64-pc-windows-msvc/dist/beehive-${{ steps.source.outputs.version }}-win32-x64.tar.gz
            target/x86_64-pc-windows-msvc/dist/SHA256SUMS
            target/x86_64-pc-windows-msvc/dist/manifest.json
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    outputs:
      executable_sha256: ${{ steps.release.outputs.executable_sha256 }}
    steps:
      - name: Download installer payload
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: windows-installer-payload
      - name: Publish the versioned Windows release and stable channel
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          set -euo pipefail
          # Re-running an old workflow must not overwrite an installer built
          # from a newer main, even when both share the same workspace version.
          main_sha="$(gh api "repos/$GH_REPO/git/ref/heads/main" --jq '.object.sha')"
          if [[ "$main_sha" != "$GITHUB_SHA" ]]; then
            echo "Not publishing superseded commit $GITHUB_SHA (main is $main_sha)"
            exit 0
          fi

          tag="windows-v$VERSION"
          archive="beehive-$VERSION-win32-x64.tar.gz"
          checksum="$(sha256sum "$archive")"
          if [[ "$(tr -d '\r' < SHA256SUMS)" != "$checksum" ]]; then
            echo "SHA256SUMS does not match $archive" >&2
            exit 1
          fi
          sha="${checksum%% *}"
          jq -e --arg version "v$VERSION" --arg file "$archive" --arg sha "$sha" '
            select(.version == $version)
            | .binaries[]
            | select(.platform == "win32-x64" and .file == $file and .sha256 == $sha)
            | {platform, file, sha256}
            | {version: $version, binaries: [.], binaries_v2: [.]}
          ' manifest.json > latest.json
          printf 'v%s\n' "$VERSION" > stable
          executable_sha="$(jq -er --arg file "$archive" '
            .binaries[] | select(.file == $file)
            | .executableSha256 | select(test("^[0-9a-f]{64}$"))
          ' manifest.json)"

          title="Beehive $VERSION for Windows"
          notes="Windows x64 installer payload built from https://github.com/$GH_REPO/commit/$GITHUB_SHA. This release is refreshed on pushes to main without a workspace version bump."
          # The list includes drafts, so an interrupted first publication is
          # resumed rather than bootstrapping a second release. A failed API
          # lookup does not fall through to creation.
          release_tags="$(gh api --paginate "repos/$GH_REPO/releases?per_page=100" --jq '.[].tag_name')"
          if ! grep -Fxq -- "$tag" <<< "$release_tags"; then
            gh release create "$tag" --target "$GITHUB_SHA" --title "$title" --notes "$notes" --draft
          fi
          gh release upload "$tag" "$archive" SHA256SUMS latest.json stable --clobber
          gh release edit "$tag" --target "$GITHUB_SHA" --title "$title" --notes "$notes" \
            --draft=false --prerelease=false --latest
          printf 'executable_sha256=%s\n' "$executable_sha" >> "$GITHUB_OUTPUT"

  smoke:
    needs: [build, publish]
    if: needs.publish.outputs.executable_sha256 != ''
    runs-on: windows-2022
    timeout-minutes: 20
    permissions: {}
    steps:
      - name: Install from the public fork release and check the launcher
        shell: pwsh
        env:
          EXPECTED_VERSION: ${{ needs.build.outputs.version }}
          EXPECTED_SHA256: ${{ needs.publish.outputs.executable_sha256 }}
        run: |
          Get-ChildItem Env: | Where-Object { $_.Name -like 'BEEHIVE_*' } |
            ForEach-Object { Remove-Item -LiteralPath ("Env:" + $_.Name) }
          $prefix = Join-Path $env:RUNNER_TEMP 'beehive-install'
          $env:BEEHIVE_RUST_PREFIX = $prefix
          $env:BEEHIVE_UV_BIN_DIR = Join-Path $prefix 'bin'
          try {
            irm "https://raw.githubusercontent.com/$env:GITHUB_REPOSITORY/$env:GITHUB_SHA/install.ps1" | iex
            $version = & (Join-Path $prefix 'bin\beehive.cmd') --version
            if ($LASTEXITCODE -ne 0 -or $version -cne $env:EXPECTED_VERSION) {
              throw "Installed launcher exited $LASTEXITCODE and reported '$version'; expected '$env:EXPECTED_VERSION'"
            }
            $exe = Join-Path $prefix 'share\beehive\beehive.exe'
            if ((Get-FileHash -LiteralPath $exe -Algorithm SHA256).Hash -ine $env:EXPECTED_SHA256) {
              throw 'The installed executable does not match the build from this run'
            }
            Write-Host "Verified public Windows install: beehive $version ($env:EXPECTED_SHA256)"
          } finally {
            Remove-Item -LiteralPath $prefix -Recurse -Force -ErrorAction SilentlyContinue
          }
